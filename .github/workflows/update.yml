name: Atualizar IPTV Mundi
on:
  push:
    paths:
      - 'dados/canais.json'
      - 'exportar.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: write
concurrency:
  group: iptv
  cancel-in-progress: false
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null
      - name: Gerar lista, logos e guia a partir de dados/canais.json
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: python exportar.py
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A playlist.m3u epg.xml.gz report.json logos
          git diff --cached --quiet || (git commit -m 'Atualizar lista' && git pull --rebase -X theirs origin main && git push)
